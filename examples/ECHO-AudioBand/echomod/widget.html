<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ECHO AudioBand</title>
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <div class="bar is-idle" id="bar">
    <button type="button" class="art" id="art" title="ECHO">
      <img id="cover" alt="">
      <svg class="note" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 18V7.2l9-1.7V16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="8" cy="18" r="2.4" fill="currentColor"/>
        <circle cx="17" cy="16" r="2.4" fill="currentColor"/>
      </svg>
    </button>
    <div class="meta" id="meta">
      <div class="marquee" id="titleMarquee">
        <div class="marquee-inner"><span>ECHO</span></div>
      </div>
      <div class="sub">
        <div class="marquee artist" id="artistMarquee">
          <div class="marquee-inner"><span></span></div>
        </div>
        <span class="time" id="time" hidden></span>
      </div>
    </div>
    <div class="controls" id="controls">
      <button type="button" data-action="previous" aria-label="Previous">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3h1.4v10H3zM13 3.15v9.7L5.7 8z"/></svg>
      </button>
      <button type="button" data-action="toggle" id="toggle" aria-label="Play">
        <svg viewBox="0 0 16 16" id="iconPlay" aria-hidden="true"><path d="M5 3.1v9.8L13.4 8z"/></svg>
        <svg viewBox="0 0 16 16" id="iconPause" aria-hidden="true"><path d="M4 3h2.4v10H4zM9.6 3H12v10H9.6z"/></svg>
      </button>
      <button type="button" data-action="next" aria-label="Next">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.15v9.7L10.3 8zM11.6 3H13v10h-1.4z"/></svg>
      </button>
    </div>
    <div class="progress" id="progress" hidden>
      <div class="progress-track"></div>
      <div class="progress-fill" id="fill"></div>
    </div>
  </div>
  <script src="widget.js"></script>
</body>
</html>
