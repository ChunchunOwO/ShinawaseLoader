<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ECHO AudioBand Preview</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    :root {
      --ab-bg: rgba(16, 16, 16, 0.92);
      --ab-fg: #f3f3f3;
      --ab-muted: rgba(243, 243, 243, 0.68);
      --ab-accent: #4da3ff;
    }
    *, *::before, *::after { box-sizing: border-box; user-select: none; }
    .card {
      width: 264px;
      height: 324px;
      padding: 12px;
      border-radius: 10px;
      background: var(--ab-bg);
      color: var(--ab-fg);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .cover {
      position: relative;
      width: 240px;
      height: 240px;
      flex: none;
      border-radius: 6px;
      overflow: hidden;
      background: rgba(127, 127, 127, 0.22);
      color: var(--ab-muted);
    }
    .cover img {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cover.has-cover img { display: block; }
    .cover.has-cover .note { display: none; }
    .cover .note {
      position: absolute;
      inset: 22%;
      width: 56%;
      height: 56%;
    }
    .title, .artist, .album {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
    }
    .artist, .album {
      font-size: 11px;
      font-weight: 500;
      color: var(--ab-muted);
      line-height: 1.25;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="cover" id="coverBox">
      <img id="cover" alt="">
      <svg class="note" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 18V7.2l9-1.7V16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="8" cy="18" r="2.4" fill="currentColor"/>
        <circle cx="17" cy="16" r="2.4" fill="currentColor"/>
      </svg>
    </div>
    <div class="title" id="title"></div>
    <div class="artist" id="artist"></div>
    <div class="album" id="album"></div>
  </div>
  <script>
    window.__echoAudioBandWidget = true;
    (() => {
      const coverBox = document.getElementById('coverBox');
      const cover = document.getElementById('cover');
      const titleEl = document.getElementById('title');
      const artistEl = document.getElementById('artist');
      const albumEl = document.getElementById('album');
      let config = { theme: 'auto', accentColor: '#4da3ff' };
      let status = null;
      const hexOk = (value) => typeof value === 'string' && /^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/iu.test(value.trim());
      const isIdle = (payload) => {
        if (!payload) return true;
        if (payload.state === 'idle') return true;
        if (!payload.title && !payload.artist) return true;
        if (payload.state === 'stopped' && !payload.title) return true;
        return false;
      };
      const applyTheme = () => {
        const themeName = config.resolvedTheme || config.theme;
        const dark = themeName !== 'light';
        const root = document.documentElement;
        root.style.setProperty('--ab-bg', dark ? 'rgba(16,16,16,0.92)' : 'rgba(243,243,243,0.92)');
        root.style.setProperty('--ab-fg', dark ? '#f3f3f3' : '#1a1a1a');
        root.style.setProperty('--ab-muted', dark ? 'rgba(243,243,243,0.68)' : 'rgba(26,26,26,0.62)');
        root.style.setProperty('--ab-accent', hexOk(config.accentColor) ? config.accentColor.trim() : '#4da3ff');
      };
      const applyStatus = (payload) => {
        status = payload && typeof payload === 'object' ? payload : null;
        const idle = isIdle(status);
        titleEl.textContent = idle ? 'ECHO' : String(status.title || 'ECHO');
        artistEl.textContent = idle ? '' : String(status.artist || '');
        albumEl.textContent = idle ? '' : String(status.album || '');
        const url = !idle && status.coverUrl ? String(status.coverUrl) : '';
        if (url) {
          cover.src = url;
          coverBox.classList.add('has-cover');
        } else {
          cover.removeAttribute('src');
          coverBox.classList.remove('has-cover');
        }
      };
      cover.addEventListener('error', () => {
        coverBox.classList.remove('has-cover');
        cover.removeAttribute('src');
      });
      applyTheme();
      applyStatus(null);
      try {
        window.audioband?.onConfig?.((next) => {
          if (!next || typeof next !== 'object') return;
          config = { ...config, ...next };
          applyTheme();
        });
        window.audioband?.onStatus?.((next) => applyStatus(next));
        window.audioband?.ready?.();
      } catch {}
    })();
  </script>
</body>
</html>
