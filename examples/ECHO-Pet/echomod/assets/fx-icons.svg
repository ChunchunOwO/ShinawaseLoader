<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    ECHO Classic Pet - pixel stage FX glyphs (v3).
    Replaces the emoji stage FX (sleep zzz, music notes, sparkles, eat
    crumbs, dizzy star, work gear) with crisp currentColor
    pixel symbols matching controls-echo.svg / ui-icons.svg. pet.js inlines
    this file into the document, so <use href="#fx-*"> resolves without
    external-reference support; echo-pet-states.js builds the .eps-fx-layer
    glyph elements and pet-sprite.css positions, colors and animates them.
  -->
  <symbol id="fx-zzz" viewBox="0 0 24 24">
    <g fill="currentColor" shape-rendering="crispEdges">
      <rect x="3" y="3" width="10" height="2"/>
      <rect x="9" y="5" width="3" height="2"/>
      <rect x="7" y="7" width="3" height="2"/>
      <rect x="5" y="9" width="3" height="2"/>
      <rect x="3" y="11" width="10" height="2"/>
      <rect x="13" y="14" width="7" height="2"/>
      <rect x="16" y="16" width="2" height="2"/>
      <rect x="13" y="18" width="7" height="2"/>
    </g>
  </symbol>
  <symbol id="fx-note" viewBox="0 0 24 24">
    <g fill="currentColor" shape-rendering="crispEdges">
      <rect x="12" y="4" width="2" height="12"/>
      <rect x="14" y="4" width="3" height="2"/>
      <rect x="16" y="6" width="2" height="3"/>
      <rect x="15" y="9" width="2" height="2"/>
      <rect x="8" y="15" width="6" height="5"/>
      <rect x="7" y="16" width="1" height="3"/>
    </g>
  </symbol>
  <symbol id="fx-sparkle" viewBox="0 0 24 24">
    <g fill="currentColor" shape-rendering="crispEdges">
      <rect x="11" y="3" width="2" height="18"/>
      <rect x="3" y="11" width="18" height="2"/>
      <rect x="10" y="6" width="4" height="12"/>
      <rect x="6" y="10" width="12" height="4"/>
    </g>
  </symbol>
  <symbol id="fx-crumb" viewBox="0 0 24 24">
    <g fill="currentColor" shape-rendering="crispEdges">
      <rect x="10" y="3" width="4" height="2"/>
      <rect x="8" y="5" width="6" height="2"/>
      <rect x="6" y="7" width="8" height="3"/>
      <rect x="4" y="10" width="14" height="5"/>
      <rect x="3" y="15" width="18" height="4"/>
      <rect x="18" y="6" width="2" height="2"/>
      <rect x="19" y="11" width="2" height="2"/>
    </g>
  </symbol>
  <symbol id="fx-dizzy" viewBox="0 0 24 24">
    <g fill="currentColor" shape-rendering="crispEdges">
      <rect x="8" y="5" width="2" height="12"/>
      <rect x="3" y="10" width="12" height="2"/>
      <rect x="6" y="8" width="6" height="6"/>
      <rect x="17" y="4" width="2" height="2"/>
      <rect x="19" y="10" width="2" height="2"/>
      <rect x="17" y="16" width="2" height="2"/>
    </g>
  </symbol>
  <symbol id="fx-gear" viewBox="0 0 24 24">
    <g fill="currentColor" shape-rendering="crispEdges">
      <rect x="10" y="4" width="4" height="4"/>
      <rect x="10" y="16" width="4" height="4"/>
      <rect x="4" y="10" width="4" height="4"/>
      <rect x="16" y="10" width="4" height="4"/>
      <rect x="5" y="5" width="3" height="3"/>
      <rect x="16" y="5" width="3" height="3"/>
      <rect x="5" y="16" width="3" height="3"/>
      <rect x="16" y="16" width="3" height="3"/>
      <rect x="7" y="7" width="10" height="3"/>
      <rect x="7" y="14" width="10" height="3"/>
      <rect x="7" y="10" width="3" height="4"/>
      <rect x="14" y="10" width="3" height="4"/>
    </g>
  </symbol>
</svg>
