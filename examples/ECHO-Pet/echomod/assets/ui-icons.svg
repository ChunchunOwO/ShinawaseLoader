<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    ECHO Classic Pet — pixel UI icon sprite (v3).
    currentColor symbols used by the action dock, panel titlebars and the
    context menu. pet.js inlines this file into the document, so
    <use href="#icon-*"> resolves without external-reference support.
  -->
  <symbol id="icon-shop" viewBox="0 0 24 24">
    <g fill="currentColor" shape-rendering="crispEdges">
      <rect x="4" y="3" width="16" height="2"/>
      <rect x="2" y="5" width="20" height="3"/>
      <rect x="2" y="8" width="4" height="2"/>
      <rect x="8" y="8" width="3" height="2"/>
      <rect x="13" y="8" width="3" height="2"/>
      <rect x="18" y="8" width="4" height="2"/>
      <rect x="4" y="10" width="5" height="9"/>
      <rect x="15" y="10" width="5" height="9"/>
      <rect x="9" y="10" width="6" height="4"/>
      <rect x="3" y="19" width="18" height="2"/>
    </g>
  </symbol>
  <symbol id="icon-stats" viewBox="0 0 24 24">
