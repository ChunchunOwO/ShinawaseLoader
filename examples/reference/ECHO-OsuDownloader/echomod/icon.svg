<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="echoOsuBg" x1="6" y1="2" x2="40" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9D174D"/>
      <stop offset=".48" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="echoOsuSheen" x1="24" y1="1" x2="24" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="echoOsuClip">
      <rect width="48" height="48" rx="11"/>
    </clipPath>
  </defs>
  <g clip-path="url(#echoOsuClip)">
    <!-- glass tile -->
    <rect width="48" height="48" rx="11" fill="url(#echoOsuBg)"/>
    <rect width="48" height="48" rx="11" fill="url(#echoOsuSheen)"/>
    <circle cx="13" cy="10" r="15" fill="#fff" opacity=".14"/>
    <circle cx="16" cy="13" r="3.6" fill="#fff" opacity=".22"/>
    <circle cx="38" cy="41" r="11" fill="#fff" opacity=".07"/>
    <!-- osu! hit circle: outer ring + approach ring -->
    <circle cx="24" cy="22.4" r="13.4" fill="none" stroke="#fff" stroke-width="3.4"/>
    <circle cx="24" cy="22.4" r="17.2" fill="none" stroke="#fff" stroke-width="1.4" opacity=".38"/>
    <!-- download arrow dropping through the circle -->
    <g fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 14.6v12.6"/>
      <path d="m17.8 21.6 6.2 6.2 6.2-6.2"/>
    </g>
    <!-- landing tray -->
    <path d="M13.4 38.8h21.2" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
  </g>
  <!-- rim: keeps the tile readable on light and dark lists -->
  <rect x=".65" y=".65" width="46.7" height="46.7" rx="10.35" fill="none" stroke="#fff" stroke-opacity=".24"/>
</svg>
