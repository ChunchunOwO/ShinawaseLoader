<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    Panel window page (shop / work / stats). main.cjs opens one frameless
    transparent BrowserWindow per panel with panel.html?panel=<name>.
    The title must never be exactly "ECHO Pet" — that is how the native pet
    window is identified; panel.js sets a descriptive per-panel title.
  -->
  <title>ECHO Pet Panel</title>
  <link rel="stylesheet" href="ui/echo-theme.css">
  <link rel="stylesheet" href="panel.css">
</head>
<!-- data-echo-classic-pet makes mod.js skip this window like the pet page -->
<body data-echo-classic-pet="1" data-echo-classic-pet-panel="1">
  <!-- inline SVG sprite container; panel.js injects assets/ui-icons.svg -->
  <div id="cp-sprites" hidden aria-hidden="true"></div>

  <main class="cp-panel-window ec-glass-card" id="panel-root">
    <!-- frameless window: the titlebar is the native drag region -->
    <header class="cp-panel-titlebar ec-titlebar" id="panel-titlebar">
      <span class="ec-titlebar-icon" id="panel-icon"></span>
      <span class="ec-titlebar-title" id="panel-title"></span>
      <div class="ec-titlebar-aux" id="panel-aux"></div>
      <button class="cp-panel-close ec-icon-btn" id="panel-close" type="button" title="关闭" aria-label="关闭面板">×</button>
    </header>
    <div class="cp-panel-body" id="panel-body"></div>
  </main>

  <script src="panel.js"></script>
</body>
</html>
