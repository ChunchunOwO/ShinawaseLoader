<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    ECHO Classic Pet — pixel transport control glyphs (v3).
    Replaces the cropped echo-pet-controls.png sprite sheet with crisp
    currentColor SVG symbols. pet.js inlines this file into the document,
    so <use href="#ctrl-*"> resolves without external-reference support.
  -->
  <symbol id="ctrl-previous" viewBox="0 0 24 24">
    <g fill="currentColor" shape-rendering="crispEdges">
      <rect x="5" y="5" width="3" height="14"/>
      <rect x="16" y="5" width="3" height="14"/>
      <rect x="14" y="7" width="2" height="10"/>
      <rect x="12" y="9" width="2" height="6"/>
      <rect x="10" y="11" width="2" height="2"/>
    </g>
  </symbol>
  <symbol id="ctrl-next" viewBox="0 0 24 24">
    <g fill="currentColor" shape-rendering="crispEdges">
      <rect x="16" y="5" width="3" height="14"/>
      <rect x="5" y="5" width="3" height="14"/>
      <rect x="8" y="7" width="2" height="10"/>
      <rect x="10" y="9" width="2" height="6"/>
      <rect x="12" y="11" width="2" height="2"/>
    </g>
  </symbol>
  <symbol id="ctrl-play" viewBox="0 0 24 24">
    <g fill="currentColor" shape-rendering="crispEdges">
      <rect x="7" y="4" width="3" height="16"/>
      <rect x="10" y="6" width="2" height="12"/>
      <rect x="12" y="8" width="2" height="8"/>
      <rect x="14" y="10" width="2" height="4"/>
      <rect x="16" y="11" width="2" height="2"/>
    </g>
  </symbol>
  <symbol id="ctrl-pause" viewBox="0 0 24 24">
    <g fill="currentColor" shape-rendering="crispEdges">
      <rect x="6" y="5" width="4" height="14"/>
      <rect x="14" y="5" width="4" height="14"/>
    </g>
  </symbol>
</svg>
