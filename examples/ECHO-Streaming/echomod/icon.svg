<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="echoStrBg" x1="6" y1="2" x2="40" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#312E81"/>
      <stop offset=".48" stop-color="#5B4CFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="echoStrSheen" x1="24" y1="1" x2="24" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="echoStrClip">
      <rect width="48" height="48" rx="11"/>
    </clipPath>
  </defs>
  <g clip-path="url(#echoStrClip)">
    <!-- glass tile -->
    <rect width="48" height="48" rx="11" fill="url(#echoStrBg)"/>
    <rect width="48" height="48" rx="11" fill="url(#echoStrSheen)"/>
    <circle cx="13" cy="10" r="15" fill="#fff" opacity=".14"/>
    <circle cx="16" cy="13" r="3.6" fill="#fff" opacity=".22"/>
    <circle cx="37" cy="40" r="11" fill="#fff" opacity=".07"/>
    <!-- cloud: streaming source, three distinct puffs -->
    <g fill="#fff">
      <circle cx="14.2" cy="33.6" r="5.5"/>
      <circle cx="24" cy="28.2" r="8.1"/>
      <circle cx="34" cy="33.4" r="5.3"/>
      <rect x="9" y="32.4" width="29.8" height="6.8" rx="3.4"/>
    </g>
    <!-- waveform: high-resolution audio planted in the cloud -->
    <g fill="#fff">
      <rect x="13.6" y="19" width="2.7" height="13.2" rx="1.35"/>
      <rect x="18" y="13.6" width="2.7" height="18.6" rx="1.35"/>
      <rect x="22.4" y="11" width="2.7" height="21.2" rx="1.35"/>
      <rect x="26.8" y="15.8" width="2.7" height="16.4" rx="1.35"/>
      <rect x="31.2" y="14.4" width="2.7" height="17.8" rx="1.35"/>
    </g>
    <!-- broadcast signal -->
    <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <path d="M34.6 12.2a8.6 8.6 0 0 1 7.2 7.6"/>
      <path d="M36.2 15a5.4 5.4 0 0 1 4.4 4.8" opacity=".62"/>
    </g>
  </g>
  <!-- rim: keeps the tile readable on light and dark lists -->
  <rect x=".65" y=".65" width="46.7" height="46.7" rx="10.35" fill="none" stroke="#fff" stroke-opacity=".24"/>
</svg>
